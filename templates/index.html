{% extends "base.html" %}

{% block title %}New Part - Stock Size Selector{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Part</h2>
    <div id="alert-container"></div>
    
    <form id="part-form">
        <!-- Basic Info -->
        <div class="section">

            <div class="form-group">
                <label for="external-part-number">External Part Number</label>
                <input type="text" id="external-part-number" name="external_part_number" placeholder="e.g. EXT-001">
            </div>

            <div class="form-group">
                <label for="external-part-name">External Part Name</label>
                <input type="text" id="external-part-name" name="external_part_name" placeholder="e.g. Widget">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="revision-number">Revision Number</label>
                    <input type="text" id="revision-number" name="revision_number" placeholder="A">
                </div>

                <div class="form-group">
                    <label for="approval-engineer">Approval Engineer</label>
                    <input type="text" id="approval-engineer" name="approval_engineer" placeholder="Engineer Name">
                </div>
            </div>

            <div class="form-group">
                <label><input type="checkbox" id="associate-company" name="associate_company"> Associate this part with a company</label>
            </div>

            <div class="form-group hidden" id="company-group">
                <label for="company-name">Company Name (optional)</label>
                <input type="text" id="company-name" name="company_name" placeholder="Acme Co">
            </div>
        </div>





 
        <button type="submit" class="btn btn-primary">Add Part</button>
    </form>

</div>
{% endblock %}

<!-- Success modal -->
<div id="success-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
        <h3 id="modal-title">Part added</h3>
        <div id="modal-body"></div>
    </div>
</div>

{% block extra_styles %}
<style>
    .hidden {
        display: none !important;
    }
    
    #results {
        border: 2px solid #27ae60;
    }
    
    .result-item {
        padding: 0.5rem 0;
        font-size: 1.1rem;
    }
    
    .result-item strong {
        color: #2c3e50;
    }

    /* Modal styles */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .modal.hidden { display: none !important; }

    .modal-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
    }

    .modal-content {
        position: relative;
        background: #fff;
        padding: 1.5rem;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        z-index: 1010;
        max-width: 520px;
        width: 90%;
    }

    .modal-close {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: transparent;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    // Form submission
    document.getElementById('part-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = {
            name: formData.get('name'),
            external_part_number: formData.get('external_part_number'),
            external_part_name: formData.get('external_part_name'),
            revision_number: formData.get('revision_number'),
            approval_engineer: formData.get('approval_engineer'),
            company_name: formData.get('company_name') || null,
        };



        try {
            const response = await fetch('/api/parts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                showAlert('Part added successfully!', 'success');
                // Show modal with details about the added part (use posted data plus server result)
                try {
                    showModal(data, result);
                } catch (e) {
                    console.error('Failed to show modal', e);
                }
            } else {
                showAlert('Error adding part', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error.message, 'error');
        }
    });

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 3000);
    }

    // Modal helpers
    function showModal(postedData, serverResult) {
        const modal = document.getElementById('success-modal');
        const body = document.getElementById('modal-body');

        const name = postedData.name || postedData.external_part_name || 'Unnamed part';
        const extNum = postedData.external_part_number || '';
        const revision = postedData.revision_number || '';
        const engineer = postedData.approval_engineer || '';
        const company = postedData.company_name || '';

        // Build HTML summary
        let html = '<div style="margin-top:0.5rem">';
        html += `<div><strong>Name:</strong> ${escapeHtml(name)}</div>`;
        if (extNum) html += `<div><strong>External #:</strong> ${escapeHtml(extNum)}</div>`;
        if (revision) html += `<div><strong>Revision:</strong> ${escapeHtml(revision)}</div>`;
        if (engineer) html += `<div><strong>Approval Engineer:</strong> ${escapeHtml(engineer)}</div>`;
        if (company) html += `<div><strong>Company:</strong> ${escapeHtml(company)}</div>`;

        html += '</div>';
        body.innerHTML = html;

        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
    }

    function hideModal() {
        const modal = document.getElementById('success-modal');
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
    }

    // Close handlers
    document.addEventListener('click', function (e) {
        const modal = document.getElementById('success-modal');
        if (!modal) return;
        if (e.target && e.target.id === 'modal-close') hideModal();
        if (e.target && e.target.id === 'modal-overlay') hideModal();
    });

    // Basic HTML escape
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
{% endblock %}
