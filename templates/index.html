{% extends "base.html" %}

{% block title %}New Part - Stock Size Selector{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Part</h2>
    <div id="alert-container"></div>
    
    <form id="part-form">
        <!-- Basic Info -->
        <div class="section">
            <h3>Part Information</h3>
            <div class="form-group">
                <label for="part-name">Part Name/Number *</label>
                <input type="text" id="part-name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="material-type">Material Type *</label>
                <select id="material-type" name="material_type" required>
                    <option value="">Select Material</option>
                    <option value="aluminum-6061">Aluminum 6061</option>
                    <option value="aluminum-7075">Aluminum 7075</option>
                    <option value="steel-1018">Steel 1018</option>
                    <option value="steel-4140">Steel 4140</option>
                    <option value="stainless-304">Stainless 304</option>
                    <option value="stainless-316">Stainless 316</option>
                    <option value="brass">Brass</option>
                    <option value="bronze">Bronze</option>
                    <option value="titanium">Titanium</option>
                </select>
            </div>

             <div class="form-group">
                <label for="operation">Operation *</label>
                <select id="operation" name="operation" required>
                    <option value="">Select Operation</option>
                    <option value="turning">Turning</option>
                    <option value="milling">Milling</option>
                    <option value="grinding">Grinding</option>
                    <option value="drilling">Drilling</option>
                </select>
            </div>
        </div>

        <!-- Dimensions -->
        <div class="section">
            <h3>Finished Part Dimensions</h3>
            <div class="form-group">
                <label for="stock-shape">Stock Shape *</label>
                <select id="stock-shape" name="stock_shape" required>
                    <option value="round">Round</option>
                    <option value="hex">Hex</option>
                    <option value="square">Square</option>
                    <option value="rectangular">Rectangular</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="stock-type">Stock Type *</label>
                <select id="stock-type" name="stock_type" required>
                    <option value="bar">Bar</option>
                    <option value="tube">Tube</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="length">Length (inches) *</label>
                    <input type="number" id="length" name="length" step="0.001" required>
                </div>

                <div class="form-group" id="diameter-group">
                    <label for="diameter">Diameter (inches) *</label>
                    <input type="number" id="diameter" name="diameter" step="0.001">
                </div>

                <!-- <div class="form-group hidden" id="width-group">
                    <label for="width">Width (inches)</label>
                    <input type="number" id="width" name="width" step="0.001">
                </div>

                <div class="form-group hidden" id="height-group">
                    <label for="height">Height (inches)</label>
                    <input type="number" id="height" name="height" step="0.001">
                </div> -->
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity *</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="extra-quantity">Extra Quantity</label>
                    <input type="number" id="extra-quantity" name="extra_quantity" min="0" value="0">
                </div>
            </div>
        </div>


        <div class="section">
            <h3>Allowances</h3>
            <div id="allowances" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label for="chuck-grip">Chuck Jaw Grip (inches)</label>
                        <input type="number" id="chuck-grip" name="chuck_grip" step="0.001" value="0.500">
                    </div>
                    
                    <div class="form-group">
                        <label for="buffer-clearance">Buffer Clearance (inches)</label>
                        <input type="number" id="buffer-clearance" name="buffer_clearance" step="0.001" value="0.125">
                    </div>
                    
                    <div class="form-group">
                        <label for="cutoff-thickness">Cutoff Tool Thickness (inches)</label>
                        <input type="number" id="cutoff-thickness" name="cutoff_thickness" step="0.001" value="0.125">
                    </div>
                    
                    <div class="form-group">
                        <label for="face-thickness">Facing Allowance (inches)</label>
                        <input type="number" id="face-thickness" name="face_thickness" step="0.001" value="0.050">
                    </div>
                    
                    <div class="form-group">
                        <label for="turning-allowance">Turning Allowance (diameter, inches)</label>
                        <input type="number" id="turning-allowance" name="turning_allowance" step="0.001" value="0.125">
                    </div>
                </div>
            </div>
        </div>



 
        <button type="submit" class="btn btn-primary">Calculate Stock Size</button>
    </form>

    <div id="results" class="section hidden" style="margin-top: 2rem; background: #e8f5e9;">
        <h3>Stock Size Recommendation</h3>
        <div id="stock-results"></div>
    </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
    .hidden {
        display: none !important;
    }
    
    #results {
        border: 2px solid #27ae60;
    }
    
    .result-item {
        padding: 0.5rem 0;
        font-size: 1.1rem;
    }
    
    .result-item strong {
        color: #2c3e50;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    // Toggle operation-specific dimensions
    document.getElementById('operation').addEventListener('change', function() {
        const operation = this.value;
        const lengthGroup = document.querySelector('[for="length"]').closest('.form-group');
        const diameterGroup = document.getElementById('diameter-group');
        const stockTypeGroup = document.querySelector('[for="stock-type"]').closest('.form-group');

        // Show/hide fields based on operation
        if (operation === 'turning') {
            // Turning: show length and diameter, hide stock type (always round)
            lengthGroup.classList.remove('hidden');
            lengthGroup.querySelector('input').required = true;
            diameterGroup.classList.remove('hidden');
            diameterGroup.querySelector('input').required = true;
            stockTypeGroup.classList.add('hidden');
            document.getElementById('stock-type').value = 'round';
        } else if (operation === 'milling') {
            // Milling: show all dimensions and stock type
            lengthGroup.classList.remove('hidden');
            lengthGroup.querySelector('input').required = true;
            stockTypeGroup.classList.remove('hidden');
            // Let stock type selection control diameter visibility
        } else if (operation === 'grinding' || operation === 'drilling') {
            // Grinding/Drilling: show length and diameter by default
            lengthGroup.classList.remove('hidden');
            lengthGroup.querySelector('input').required = true;
            diameterGroup.classList.remove('hidden');
            diameterGroup.querySelector('input').required = true;
            stockTypeGroup.classList.remove('hidden');
        } else {
            // No operation selected - show stock type selector
            stockTypeGroup.classList.remove('hidden');
        }
    });

    // Toggle stock type fields
    document.getElementById('stock-type').addEventListener('change', function() {
        const stockType = this.value;
        const diameterGroup = document.getElementById('diameter-group');
        const widthGroup = document.getElementById('width-group');
        const heightGroup = document.getElementById('height-group');

        if (stockType === 'round') {
            diameterGroup.classList.remove('hidden');
            diameterGroup.querySelector('input').required = true;
            widthGroup.classList.add('hidden');
            widthGroup.querySelector('input').required = false;
            heightGroup.classList.add('hidden');
            heightGroup.querySelector('input').required = false;
        } else {
            diameterGroup.classList.add('hidden');
            diameterGroup.querySelector('input').required = false;
            widthGroup.classList.remove('hidden');
            widthGroup.querySelector('input').required = true;
            heightGroup.classList.remove('hidden');
            heightGroup.querySelector('input').required = true;
        }
    });

    // Toggle operation details
    document.getElementById('has-lathe').addEventListener('change', function() {
        document.getElementById('lathe-details').classList.toggle('hidden', !this.checked);
    });

    document.getElementById('has-milling').addEventListener('change', function() {
        document.getElementById('milling-details').classList.toggle('hidden', !this.checked);
    });

    // Form submission
    document.getElementById('part-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = {
            name: formData.get('name'),
            material_type: formData.get('material_type'),
            dimensions: {
                length: parseFloat(formData.get('length')),
                diameter: formData.get('diameter') ? parseFloat(formData.get('diameter')) : null,
                width: formData.get('width') ? parseFloat(formData.get('width')) : null,
                height: formData.get('height') ? parseFloat(formData.get('height')) : null
            },
            quantity: parseInt(formData.get('quantity')),
            extra_quantity: parseInt(formData.get('extra_quantity')) || 0,
            tolerances: {
                general: parseFloat(formData.get('general_tolerance')),
                tight: parseFloat(formData.get('tight_tolerance'))
            },
            operations: {}
        };

        // Lathe operations
        if (formData.get('has_lathe')) {
            data.operations.lathe = {
                chuck_grip: parseFloat(formData.get('chuck_grip')),
                buffer_clearance: parseFloat(formData.get('buffer_clearance')),
                cutoff_thickness: parseFloat(formData.get('cutoff_thickness')),
                face_thickness: parseFloat(formData.get('face_thickness')),
                turning_allowance: parseFloat(formData.get('turning_allowance'))
            };
        }

        // Milling operations
        if (formData.get('has_milling')) {
            data.operations.milling = {
                length_allowance: parseFloat(formData.get('milling_length_allowance')),
                width_allowance: parseFloat(formData.get('milling_width_allowance')),
                height_allowance: parseFloat(formData.get('milling_height_allowance'))
            };
        }

        // Welding flag
        data.operations.welding = !!formData.get('has_welding');

        try {
            const response = await fetch('/api/parts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                displayResults(result.stock_recommendation);
                showAlert('Part added successfully!', 'success');
            } else {
                showAlert('Error adding part', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error.message, 'error');
        }
    });

    function displayResults(stock) {
        const resultsDiv = document.getElementById('stock-results');
        let html = '<div class="result-item"><strong>Recommended Stock Size:</strong></div>';
        
        html += `<div class="result-item">Length: <strong>${stock.length}"</strong></div>`;
        
        if (stock.diameter) {
            html += `<div class="result-item">Diameter: <strong>${stock.diameter}"</strong></div>`;
        }
        
        if (stock.width) {
            html += `<div class="result-item">Width: <strong>${stock.width}"</strong></div>`;
        }
        
        if (stock.height) {
            html += `<div class="result-item">Height: <strong>${stock.height}"</strong></div>`;
        }
        
        html += `<div class="result-item">Material: <strong>${stock.material_type}</strong></div>`;
        
        resultsDiv.innerHTML = html;
        document.getElementById('results').classList.remove('hidden');
    }

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 3000);
    }
</script>
{% endblock %}
